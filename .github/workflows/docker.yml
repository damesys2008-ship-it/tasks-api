name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - name: Récupérer le code
          uses: actions/checkout@v6

        - name: Installer Python 3.12
          uses: actions/setup-python@v7
          with:
            python-version: "3.12"

        - name: Installer les dépendances
          run: pip install -r requirements-dev.txt

        - name: Lancer les tests
          run: pytest

    build:
      needs: test
      runs-on: ubuntu-latest
      permissions:
        contents: read
        packages: write
      steps:
        - name: Récupérer le code
          uses: actions/checkout@v6

        - name: Mettre le propriétaire en minuscules
          id: repo
          run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

        - name: Déterminer la version de l'application
          id: version
          run: |
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            else
              echo "value=dev" >> "$GITHUB_OUTPUT"
            fi

        - name: Configurer Docker Buildx
          uses: docker/setup-buildx-action@v4

        - name: Se connecter à GHCR
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Générer les métadonnées de l'image
          id: meta
          uses: docker/metadata-action@v6
          with:
            images: ghcr.io/${{ steps.repo.outputs.owner }}/tasks-api
            tags: |
              type=sha,format=short
              type=semver,pattern={{version}}

        - name: Construire et publier l'image
          uses: docker/build-push-action@v7
          with:
            context: .
            push: true
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            build-args: APP_VERSION=${{ steps.version.outputs.value }}

    deploy-staging:
      needs: build
      runs-on: ubuntu-latest
      environment: staging
      permissions:
        packages: read
      steps:
        - name: Mettre le propriétaire en minuscules
          id: repo
          run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
  
        - name: Se connecter à GHCR
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
  
        - name: Lancer et tester l'image du commit
          run: |
            image="ghcr.io/${{ steps.repo.outputs.owner }}/tasks-api:sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
            docker run -d --name tasks-api -p 8000:8000 "$image"
            for attempt in {1..10}; do
              if curl -fsS http://localhost:8000/health && curl -fsS http://localhost:8000/version; then
                exit 0
              fi
              sleep 2
            done
            docker logs tasks-api
            exit 1
  
    deploy-production:
      needs: deploy-staging
      if: startsWith(github.ref, 'refs/tags/v')
      runs-on: ubuntu-latest
      environment: production
      permissions:
        packages: read
      steps:
        - name: Mettre le propriétaire en minuscules
          id: repo
          run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
  
        - name: Se connecter à GHCR
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
  
        - name: Lancer et tester l'image de la release
          run: |
            version="${GITHUB_REF_NAME#v}"
            image="ghcr.io/${{ steps.repo.outputs.owner }}/tasks-api:$version"
            docker run -d --name tasks-api -p 8000:8000 "$image"
            for attempt in {1..10}; do
              if curl -fsS http://localhost:8000/health && curl -fsS http://localhost:8000/version; then
                exit 0
              fi
              sleep 2
            done
            docker logs tasks-api
            exit 1

    update-config:
      needs: deploy-production
      if: startsWith(github.ref, 'refs/tags/v')
      runs-on: ubuntu-latest
      permissions:
        contents: read
      env:
        VERSION: ${{ github.ref_name }}
      steps:
        - name: Récupérer le dépot applicatif
          uses: actions/checkout@v6

        - name: Récupérer le dépôt de configuration
          uses: actions/checkout@v6
          with:
            repository: damesys2008-ship-it/tasks-config
            token: ${{ secrets.CONFIG_REPO_TOKEN }}
            path: config

        - name: Mettre à jour la version de l'image
          run: bash scripts/set-image-tag.sh config/k8s/deployment.yaml "${VERSION#v}"

        - name: Commiter et pousser dans tasks-config
          run: |
            cd config
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add k8s/deployment.yaml
            git commit -m "Déploiement de tasks-api ${VERSION#v}"
            git push