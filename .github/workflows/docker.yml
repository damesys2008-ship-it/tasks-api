name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - name: Récupérer le code
          uses: actions/checkout@v6

        - name: Installer Python 3.12
          uses: actions/setup-python@v7
          with:
            python-version: "3.12"

        - name: Installer les dépendances
          run: pip install -r requirements-dev.txt

        - name: Lancer les tests
          run: pytest

    build:
      needs: test
      runs-on: ubuntu-latest
      permissions:
        contents: read
        packages: write
      steps:
        - name: Récupérer le code
          uses: actions/checkout@v6

        - name: Mettre le propriétaire en minuscules
          id: repo
          run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

        - name: Déterminer la version de l'application
          id: version
          run: |
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            else
              echo "value=dev" >> "$GITHUB_OUTPUT"
            fi

        - name: Configurer Docker Buildx
          uses: docker/setup-buildx-action@v4

        - name: Se connecter à GHCR
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Générer les métadonnées de l'image
          id: meta
          uses: docker/metadata-action@v6
          with:
            images: ghcr.io/${{ steps.repo.outputs.owner }}/tasks-api
            tags: |
              type=sha,format=short
              type=semver,pattern={{version}}

        - name: Construire et publier l'image
          uses: docker/build-push-action@v7
          with:
            context: .
            push: true
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            build-args: APP_VERSION=${{ steps.version.outputs.value }}